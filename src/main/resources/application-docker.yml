spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cloudsync}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:cloudsync}
    password: ${DB_PASSWORD:cloudsync_secret_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:cloudsync-files}
    region: ${AWS_REGION:us-east-1}

logging:
  level:
    root: INFO
    com.cloudsync: INFO
