version: '3.8'

services:
  # =====================
  # Spring Boot Backend
  # =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudsync-backend:latest
    container_name: cloudsync-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-cloudsync}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8080
    volumes:
      - /tmp/cloudsync-uploads:/tmp/cloudsync-uploads
      - backend-logs:/var/log/cloudsync
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cloudsync-network

  # =====================
  # Frontend with Nginx
  # =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: cloudsync-frontend:latest
    container_name: cloudsync-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudsync-network

networks:
  cloudsync-network:
    driver: bridge

volumes:
  backend-logs:
